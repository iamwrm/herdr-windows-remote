name: Release (Windows)

# Builds the native Windows herdr binary with `--remote` support by cloning
# upstream (ogulcancelik/herdr) at the release tag pinned in
# patches/herdr/BASE, verifying its commit via BASE_COMMIT, applying the patch
# series with `git am`, and publishing
# the Windows executable and Linux hcode shim as GitHub release assets.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-win.*"

permissions:
  contents: write

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  UPSTREAM_REPO: https://github.com/ogulcancelik/herdr
  ZIG_VERSION: 0.15.2
  ZIG_SHA256: 3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
      LIBGHOSTTY_VT_SIMD: 'false'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 5

      - name: Clone upstream at pinned base
        shell: pwsh
        run: |
          $base = (Get-Content patches\herdr\BASE).Trim()
          $expectedCommit = (Get-Content patches\herdr\BASE_COMMIT).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+-win\.\d{2}$') {
              throw "tag $env:GITHUB_REF_NAME must use vX.Y.Z-win.NN with a two-digit release counter"
            }
            $tagBase = $env:GITHUB_REF_NAME -replace '-win\.\d{2}$', ''
            if ($tagBase -ne $base) {
              throw "tag $env:GITHUB_REF_NAME does not match pinned base $base (patches/herdr/BASE)"
            }
          }
          git init checkouts/herdr
          git -C checkouts/herdr remote add origin $env:UPSTREAM_REPO
          git -C checkouts/herdr fetch --depth 1 origin "refs/tags/$base"
          if ($LASTEXITCODE -ne 0) { throw "failed to fetch upstream tag $base" }
          git -C checkouts/herdr checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "failed to check out upstream tag $base" }
          $actualCommit = (git -C checkouts/herdr rev-parse HEAD).Trim()
          if ($actualCommit -ne $expectedCommit) {
            throw "upstream tag $base resolved to $actualCommit, expected $expectedCommit (patches/herdr/BASE_COMMIT)"
          }
          "UPSTREAM_BASE=$base" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV
          "UPSTREAM_COMMIT=$actualCommit" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV

      - name: Apply patches
        shell: pwsh
        working-directory: checkouts/herdr
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          $patches = Get-ChildItem ..\..\patches\herdr\*.patch | Sort-Object Name
          git am $patches.FullName
          if ($LASTEXITCODE -ne 0) { throw "git am failed" }
          "PATCHED_COMMIT=$(git rev-parse HEAD)" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Restore Zig build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('patches/herdr/*.patch') }}
          restore-keys: |
            zig-${{ runner.os }}-${{ env.ZIG_VERSION }}-

      # mlugg/setup-zig v2.2.1 still targets deprecated Node.js 20. Install the
      # pinned Zig archive directly until that action publishes a Node.js 24 release.
      - name: Install Zig
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "zig-$env:ZIG_VERSION.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP "zig-$env:ZIG_VERSION"
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:ZIG_SHA256) {
            throw "Zig archive sha256 mismatch: expected $env:ZIG_SHA256, got $actualHash"
          }
          Expand-Archive -Path $archive -DestinationPath $installRoot
          $zigDir = Get-ChildItem -Path $installRoot -Directory | Select-Object -First 1
          if ($null -eq $zigDir) { throw "Zig archive did not contain a directory" }
          $zigDir.FullName | Out-File -Encoding utf8 -Append $env:GITHUB_PATH
          & (Join-Path $zigDir.FullName 'zig.exe') version

      - name: Build
        working-directory: checkouts/herdr
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package artifacts
        shell: pwsh
        run: |
          Copy-Item checkouts\herdr\target\x86_64-pc-windows-msvc\release\herdr.exe herdr-windows-x86_64.exe
          Copy-Item extras\remote-bin\hcode hcode
          "repo_commit=$env:GITHUB_SHA" | Out-File -Encoding utf8 BUILD_INFO.txt
          "upstream_base=$env:UPSTREAM_BASE" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          "upstream_commit=$env:UPSTREAM_COMMIT" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          "patched_commit=$env:PATCHED_COMMIT" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          "target=x86_64-pc-windows-msvc" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          "libghostty_vt_optimize=$env:LIBGHOSTTY_VT_OPTIMIZE" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          "libghostty_vt_simd=$env:LIBGHOSTTY_VT_SIMD" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          $binaryHash = (Get-FileHash -Algorithm SHA256 herdr-windows-x86_64.exe).Hash.ToLowerInvariant()
          "sha256=$binaryHash  herdr-windows-x86_64.exe" | Out-File -Encoding utf8 -Append BUILD_INFO.txt
          $hcodeHash = (Get-FileHash -Algorithm SHA256 hcode).Hash.ToLowerInvariant()
          "sha256=$hcodeHash  hcode" | Out-File -Encoding utf8 -Append BUILD_INFO.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = 'windows-remote-latest'
          }
          $commitLines = (git log -5 --pretty=format:"%H%x09%h%x09%s" | ForEach-Object {
            $parts = $_ -split "`t", 3
            "- [$($parts[1])](https://github.com/$env:GITHUB_REPOSITORY/commit/$($parts[0])) $($parts[2])"
          }) -join "`n"
          @"
          Native Windows build: upstream herdr $env:UPSTREAM_BASE + patches/herdr series, with ``herdr --remote`` support. Includes the ``hcode`` Linux shim for opening local VS Code Remote-SSH.

          **Repository commit:** [$($env:GITHUB_SHA.Substring(0, 7))](https://github.com/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA)

          ### Recent repository commits (up to 5)

          $commitLines

          See BUILD_INFO.txt for the upstream and patched commits and artifact SHA-256 checksums.
          "@ | Out-File -Encoding utf8 RELEASE_NOTES.md

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --prerelease `
              --title "herdr $tag (Windows --remote)" `
              --notes-file RELEASE_NOTES.md
          } else {
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "herdr $tag (Windows --remote)" `
              --notes-file RELEASE_NOTES.md
          }
          gh release upload $tag herdr-windows-x86_64.exe hcode BUILD_INFO.txt --repo $env:GITHUB_REPOSITORY --clobber
