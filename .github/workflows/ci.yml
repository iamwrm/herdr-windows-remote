name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  UPSTREAM_REPO: https://github.com/herdrdev/herdr
  ZIG_VERSION: 0.15.2
  ZIG_LINUX_X86_64_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
  ZIG_WINDOWS_X86_64_SHA256: 3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
  LIBGHOSTTY_VT_SIMD: 'false'

jobs:
  verify:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux patch and unit checks
            os: ubuntu-latest
          - name: Windows client and release build
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 5

      - name: Clone pinned upstream
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          base=$(tr -d '\r\n' < patches/herdr/BASE)
          expected_commit=$(tr -d '\r\n' < patches/herdr/BASE_COMMIT)
          git init checkouts/herdr
          git -C checkouts/herdr remote add origin "$UPSTREAM_REPO"
          git -C checkouts/herdr fetch --depth 1 origin "refs/tags/$base"
          git -C checkouts/herdr checkout --detach FETCH_HEAD
          actual_commit=$(git -C checkouts/herdr rev-parse HEAD)
          test "$actual_commit" = "$expected_commit"

      - name: Clone pinned upstream
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = (Get-Content patches\herdr\BASE).Trim()
          $expectedCommit = (Get-Content patches\herdr\BASE_COMMIT).Trim()
          git init checkouts/herdr
          git -C checkouts/herdr remote add origin $env:UPSTREAM_REPO
          git -C checkouts/herdr fetch --depth 1 origin "refs/tags/$base"
          if ($LASTEXITCODE -ne 0) { throw "failed to fetch upstream tag $base" }
          git -C checkouts/herdr checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "failed to check out upstream tag $base" }
          $actualCommit = (git -C checkouts/herdr rev-parse HEAD).Trim()
          if ($actualCommit -ne $expectedCommit) {
            throw "upstream tag $base resolved to $actualCommit, expected $expectedCommit"
          }

      - name: Apply patch stack
        shell: bash
        if: runner.os == 'Linux'
        working-directory: checkouts/herdr
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git am ../../patches/herdr/*.patch

      - name: Apply patch stack
        shell: pwsh
        if: runner.os == 'Windows'
        working-directory: checkouts/herdr
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          $patches = Get-ChildItem ..\..\patches\herdr\*.patch | Sort-Object Name
          git am $patches.FullName
          if ($LASTEXITCODE -ne 0) { throw "git am failed" }

      - name: Install Rust
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt, clippy

      - name: Install Rust
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master 2026-07-16
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Restore Zig build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}
          key: zig-ci-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('patches/herdr/*.patch') }}
          restore-keys: |
            zig-ci-${{ runner.os }}-${{ env.ZIG_VERSION }}-

      - name: Install Zig
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-$ZIG_VERSION.tar.xz"
          url="https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          curl --fail --location --retry 3 --output "$archive" "$url"
          printf '%s  %s\n' "$ZIG_LINUX_X86_64_SHA256" "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install Zig
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "zig-$env:ZIG_VERSION.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP "zig-$env:ZIG_VERSION"
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:ZIG_WINDOWS_X86_64_SHA256) {
            throw "Zig archive sha256 mismatch: expected $env:ZIG_WINDOWS_X86_64_SHA256, got $actualHash"
          }
          Expand-Archive -Path $archive -DestinationPath $installRoot
          $zigDir = Get-ChildItem -Path $installRoot -Directory | Select-Object -First 1
          if ($null -eq $zigDir) { throw "Zig archive did not contain a directory" }
          $zigDir.FullName | Out-File -Encoding utf8 -Append $env:GITHUB_PATH

      - name: Linux verification
        if: runner.os == 'Linux'
        shell: bash
        working-directory: checkouts/herdr
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --bin herdr -- -D warnings
          cargo test --locked --bin herdr clipboard_image
          cargo test --locked --bin herdr remote_clipboard_image_buffer
          cargo test --locked --bin herdr client::
          cargo test --locked --bin herdr remote::
          cargo test --locked --bin herdr protocol::wire::
          python3 -m unittest scripts.test_package_windows_conpty

      - name: Windows verification
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: checkouts/herdr
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed" }
          cargo clippy --locked --bin herdr -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          cargo test --locked --bin herdr clipboard_image
          if ($LASTEXITCODE -ne 0) { throw "Windows clipboard tests failed" }
          cargo test --locked --bin herdr remote::
          if ($LASTEXITCODE -ne 0) { throw "Windows remote tests failed" }
          cargo test --locked --bin herdr client::
          if ($LASTEXITCODE -ne 0) { throw "Windows client tests failed" }
          cargo test --locked --bin herdr protocol::wire::
          if ($LASTEXITCODE -ne 0) { throw "endpoint codec tests failed" }
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "release build failed" }

      - name: Verify Windows release package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stageDir = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          & .\checkouts\herdr\scripts\package_windows_conpty.ps1 `
            -HerdrExe checkouts\herdr\target\x86_64-pc-windows-msvc\release\herdr.exe `
            -PackagePath (Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg") `
            -StageDir $stageDir `
            -OutputPath (Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64.zip")
          & .\checkouts\herdr\scripts\windows_smoke_conpty_path.ps1 `
            -ExePath (Join-Path $stageDir "herdr.exe")
